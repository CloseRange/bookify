<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookify Publishing Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>

    <main class="card">
      <nav class="nav">
        <a href="index.html" class="active">Create</a>
        <a href="books.html">Library</a>
      </nav>
      <header>
        <div class="logo">📖</div>
        <h1>Publishing Studio</h1>
        <p class="subtitle">Describe your idea and let the authors write it.</p>
      </header>

      <form id="form">
        <label for="prompt">Your book idea</label>
        <textarea
          id="prompt"
          rows="4"
          placeholder="e.g. Write a book about a magic cat"
          required
        ></textarea>
        <button id="generate" type="submit">
          <span class="btn-label">Generate book</span>
          <span class="spinner"></span>
        </button>
      </form>

      <section id="progress" class="progress hidden" aria-live="polite">
        <div class="progress-head">
          <span id="step-label" class="step-label">Queued</span>
          <span id="percent" class="percent">0%</span>
        </div>
        <div class="bar">
          <div id="bar-fill" class="bar-fill"></div>
        </div>
        <div id="step-count" class="step-count">Step 0 of 6</div>
      </section>

      <section id="error" class="message error hidden"></section>

      <section id="result" class="result hidden">
        <h2>Result</h2>
        <pre id="result-body"></pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
